name: Publish Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Version to use when preparing a release."
        required: true
        default: "X.Y.Z"
      developmentVersion:
        description: "Version to use for new local working copy."
        required: true
        default: "X.Y.Z-SNAPSHOT"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        server-id: central-portal
        server-username-env-var: MAVEN_USERNAME
        server-password-env-var: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        gpg-passphrase-env-var: OSSRH_GPG_SECRET_KEY_PASSWORD
    - name: Configure Git user
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
    - name: Build, Release and Publish to OSSRH
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        OSSRH_GPG_SECRET_KEY_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: |
        mvn \
        --no-transfer-progress \
        --batch-mode \
        -DreleaseVersion=${{ inputs.releaseVersion }} \
        -DdevelopmentVersion=${{ inputs.developmentVersion }} \
        release:prepare \
        release:perform \
        -P publish
    - name: Push changes and tags
      run: |
        git push
        git push --tags
