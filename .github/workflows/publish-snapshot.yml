name: Publish Snapshots

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
        server-id: central-portal
        server-username-env-var: MAVEN_USERNAME
        server-password-env-var: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        gpg-passphrase-env-var: OSSRH_GPG_SECRET_KEY_PASSWORD
    - name: Build and Publish to OSSRH
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        OSSRH_GPG_SECRET_KEY_PASSWORD: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: mvn --no-transfer-progress --batch-mode clean deploy -P publish
